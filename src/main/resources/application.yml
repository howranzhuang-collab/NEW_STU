spring:
  application:
    name: foreign-student-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/foreign_student_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.university: debug
    org.springframework.security: debug

# JWT 配置
jwt:
  secret: foreignStudentServiceSecretKeyForJwtTokenGeneration2024
  expiration: 86400000  # 24小时，单位：毫秒

# 文件上传配置
file:
  upload-dir: uploads  # 文件上传目录

# 签证管理配置
visa:
  expiring-soon-days: 30  # 提前提醒天数（默认30天）

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

